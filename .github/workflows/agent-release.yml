name: Agent release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - name: Test agent
        working-directory: apps/agent
        run: go test ./...
      - name: Build native archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -C apps/agent -trimpath -o "$PWD/dist/scope-agent" ./cmd/agent
              tar -C dist -czf "dist/scope-agent_${os}_${arch}.tar.gz" scope-agent
              rm dist/scope-agent
            done
          done
          cd dist
          sha256sum scope-agent_*.tar.gz > SHA256SUMS
          cp ../scripts/install-agent.sh install.sh
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: scope-agent-release-candidate
          path: dist/
