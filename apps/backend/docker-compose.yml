services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-orion}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    # Ports are NOT published to the host — the backend is reached only through
    # the Caddy reverse proxy, so raw plaintext gRPC/HTTP is never exposed.
    expose:
      - "${HTTP_PORT:-4000}"
      - "${GRPC_PORT:-50052}"
    environment:
      # ── Server ──────────────────────────────────────
      HTTP_PORT: ${HTTP_PORT:-4000}
      GRPC_PORT: ${GRPC_PORT:-50052}

      # ── Database (required) ─────────────────────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-orion}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-orion}

      # ── Redis (required for multi-instance WS) ──────
      REDIS_URL: redis://redis:6379

      # ── Auth secrets (required) ─────────────────────
      # IMPORTANT: change these in production
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:-change-me-agent-secret}
      USER_JWT_SECRET: ${USER_JWT_SECRET:-change-me-user-secret}

      # ── Optional ────────────────────────────────────
      AGENT_ACCESS_TTL_SEC: ${AGENT_ACCESS_TTL_SEC:-900}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OFFLINE_AFTER_SEC: ${OFFLINE_AFTER_SEC:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # TLS terminator + protocol router. Publishes the only host-facing ports.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN:-localhost}
      HTTP_PORT: ${HTTP_PORT:-4000}
      GRPC_PORT: ${GRPC_PORT:-50052}
      # Local dev default is "tls internal". In production set CADDY_TLS="" and a
      # real PROXY_DOMAIN so Caddy provisions a Let's Encrypt certificate.
      CADDY_TLS: ${CADDY_TLS:-tls internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
