server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /docs {
    default_type text/html;
    try_files /docs/index.html =404;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
