services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-orion-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      AGENT_DISK_PATH: /host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host:ro
    privileged: true
    network_mode: host
    pid: host
    read_only: true
    tmpfs:
      - /tmp
