# Pulls prebuilt Scope images; no source checkout or local image build required.
# Copy .env.example to .env, fill every required value, then:
#   docker compose --env-file .env -f compose.yml up -d
name: scope

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scope -d scope"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    image: tiagomiguel29/scope-backend:${SCOPE_IMAGE_TAG:-main}
    restart: "no"
    command: ["npm", "run", "migration:run:prod"]
    environment:
      DATABASE_URL: postgresql://scope:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scope
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: tiagomiguel29/scope-backend:${SCOPE_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${SCOPE_BIND_ADDRESS:-127.0.0.1}:${SCOPE_API_PORT:-4000}:4000"
      - "${SCOPE_BIND_ADDRESS:-127.0.0.1}:${SCOPE_GRPC_PORT:-50052}:50052"
    environment:
      HTTP_PORT: 4000
      GRPC_PORT: 50052
      DATABASE_URL: postgresql://scope:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scope
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS: "true"
      DB_SYNCHRONIZE: "false"
      CORS_ORIGIN: ${SCOPE_WEB_ORIGIN:?Set SCOPE_WEB_ORIGIN in .env}
      WEBAUTHN_ORIGIN: ${SCOPE_WEB_ORIGIN:?Set SCOPE_WEB_ORIGIN in .env}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:?Set AGENT_JWT_SECRET in .env}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?Set USER_JWT_SECRET in .env}
      MFA_ENCRYPTION_SECRET: ${MFA_ENCRYPTION_SECRET:?Set MFA_ENCRYPTION_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: tiagomiguel29/scope-web:${SCOPE_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${SCOPE_BIND_ADDRESS:-127.0.0.1}:${SCOPE_WEB_PORT:-3000}:3000"
    environment:
      SCOPE_PUBLIC_API_URL: ${SCOPE_API_URL:?Set SCOPE_API_URL in .env}
      SCOPE_PUBLIC_AGENT_SERVER_ADDRESS: ${SCOPE_AGENT_GRPC_ADDRESS:?Set SCOPE_AGENT_GRPC_ADDRESS in .env}
      SCOPE_PUBLIC_AGENT_TLS_DISABLE: ${SCOPE_AGENT_TLS_DISABLE:-false}
    depends_on:
      - backend

  landing:
    image: tiagomiguel29/scope-landing:${SCOPE_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${SCOPE_BIND_ADDRESS:-127.0.0.1}:${SCOPE_LANDING_PORT:-8080}:80"

volumes:
  postgres_data:
